# ~/.telecode/config.yaml — user edits, daemon is read-only.
telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}     # loaded from ~/.telecode/.env
  allowed_user_ids: [123456789]        # ← THAY bằng user_id của bạn (lấy qua @userinfobot)
daemon:
  log_dir: ~/.telecode/logs
  approval_timeout_sec: 300
  workspace_scan:
    roots: [~/Documents/workspaces]
    max_depth: 1
    exclude: [node_modules, .git, dist, build]
agents:
  claude:
    binary: claude
    setting_sources: [user, project, local]
  kiro:
    # NOT the `kiro` IDE launcher — needs the headless `kiro-cli` (v2.3+).
    # Bare binary name OK: telecode tự prepend các user-runtime paths
    # (~/.local/bin, ~/.cargo/bin, ~/.bun/bin, nvm, …) vào PATH lúc spawn
    # qua buildKiroMcpPath() — kể cả khi launchd's default PATH không có.
    # Nếu vẫn không resolve được, dùng absolute path: `which kiro-cli`.
    binary: kiro-cli
    # agent: telecode                  # default = `telecode` (auto-generated at ~/.kiro/agents/telecode.json with preToolUse hook → daemon)
    # model: claude-opus-4.8            # optional: kiro-cli --model
defaults:
  agent: claude
session_switch_preview_lines: 3
notifier:
  # How long (ms) to gather streaming text chunks before flushing to Telegram.
  # Increase to reduce notification spam; decrease for more "live" feel.
  debounce_ms: 3000
  # Per-session output buffer cap (bytes). When the background session's output
  # exceeds this, middle chunks are dropped and replaced with a `… [N chunks
  # omitted] …` marker. Increase if you want longer catch-up logs.
  buffer_cap_bytes: 50000
